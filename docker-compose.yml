version: '3.8'

services:
  rag-assistant:
    build: .
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - AWS_REGION=${AWS_REGION}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
    volumes:
      - ./indexes:/app/indexes
      - ./data:/app/data
    restart: unless-stopped
