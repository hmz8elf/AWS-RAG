name: Build and Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/rag-aws-assistant:$IMAGE_TAG .
          docker push $ECR_REGISTRY/rag-aws-assistant:$IMAGE_TAG
          docker tag $ECR_REGISTRY/rag-aws-assistant:$IMAGE_TAG \
                     $ECR_REGISTRY/rag-aws-assistant:latest
          docker push $ECR_REGISTRY/rag-aws-assistant:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            aws ecr get-login-password --region eu-west-1 | \
              docker login --username AWS \
              --password-stdin ${{ steps.login-ecr.outputs.registry }}
            docker pull ${{ steps.login-ecr.outputs.registry }}/rag-aws-assistant:latest
            docker stop rag-assistant || true
            docker rm rag-assistant || true
            docker run -d \
              --name rag-assistant \
              -p 8000:8000 \
              --env-file /home/ubuntu/.env \
              ${{ steps.login-ecr.outputs.registry }}/rag-aws-assistant:latest
